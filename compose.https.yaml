services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      user:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?请在 .env 中设置 ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: english-study-caddy-data
  caddy_config:
    name: english-study-caddy-config
