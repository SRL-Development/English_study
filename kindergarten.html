<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffca45">
<title>动画英语岛 · EnglishLab Family</title>
<link rel="stylesheet" href="/kids/runtime-style?v=1.3.5">
</head>
<body>
<div class="learn-shell kids-shell">
  <div class="learn-top"><header class="kids-top"><a class="kids-brand" href="/kids"><span class="kids-mark">🎈</span><span>动画英语岛<small>story · song · speak</small></span></a><div class="top-actions"><div class="reward-row"><span class="reward" id="starCount">⭐ 0</span><span class="reward" id="stickerCount">🎟️ 0</span></div><div class="learner-chip"><span class="mini-avatar" id="childAvatar">🦊</span><span id="childName">小朋友</span></div><a class="icon-btn" href="/kids" title="家长中心">⌂</a></div></header></div>
  <main class="learn-main">
    <section class="learn-intro"><div><div class="eyebrow eyebrow-coral">Cartoon English Island</div><h1>今天去哪里冒险？</h1><p>每一站都包含听一听、找一找和开口说。</p></div><div class="overall"><div class="overall-top"><span>岛屿探索进度</span><span id="progressText">0 / 15</span></div><div class="progress-track"><i id="progressBar"></i></div></div></section>
    <div class="world-tabs" id="worldTabs"></div>
    <section class="world-card sunny" id="worldCard"></section>
  </main>
</div>

<div class="modal-mask" id="activityModal" role="dialog" aria-modal="true">
  <div class="modal activity-modal">
    <div class="activity-head"><div><small id="activityStage">听一听</small><br><b id="activityName">欢迎来到动画岛</b></div><button type="button" class="close-x" onclick="closeActivity()" aria-label="关闭">×</button></div>
    <div class="activity-body" id="activityBody"></div>
  </div>
</div>
<div class="loading" id="kidsLoading"><div class="loader-card"><div class="loader-friend">🎈</div><b>正在准备动画岛…</b></div></div>
<div class="toast" id="kidsToast"></div>
<script src="/kids/runtime-app?v=1.3.5"></script>
<script>
const WORLDS=[
 {id:'hello',name:'你好小镇',desc:'用问候和颜色认识第一群朋友',icon:'🏡',skin:'sunny',lessons:[
  {id:'k-hello',title:'Hello!',icon:'👋',word:'hello',phrase:'Hello! I am Foxy.',prompt:'谁在说 hello？',answer:'hello',options:[['hello','👋'],['bye','🚪'],['sleep','🌙']]},
  {id:'k-red',title:'Red Balloon',icon:'🎈',word:'red',phrase:'The balloon is red.',prompt:'找到 red 红色',answer:'red',options:[['blue','🔵'],['red','🔴'],['green','🟢']]},
  {id:'k-blue',title:'Blue Sky',icon:'🌤️',word:'blue',phrase:'The sky is blue.',prompt:'找到 blue 蓝色',answer:'blue',options:[['yellow','🟡'],['blue','🔵'],['pink','🌸']]},
  {id:'k-happy',title:'Happy Face',icon:'😄',word:'happy',phrase:'I am happy today!',prompt:'哪一个是 happy？',answer:'happy',options:[['sad','😢'],['happy','😄'],['sleepy','😴']]},
  {id:'k-bye',title:'Goodbye Song',icon:'🌈',word:'goodbye',phrase:'Goodbye, my friend. See you!',prompt:'离开时说什么？',answer:'goodbye',options:[['goodbye','👋'],['apple','🍎'],['cat','🐱']]}
 ]},
 {id:'animals',name:'动物派对',desc:'听声音、学动作，认识可爱的动物朋友',icon:'🦁',skin:'forest',lessons:[
  {id:'k-cat',title:'Little Cat',icon:'🐱',word:'cat',phrase:'The little cat says meow.',prompt:'找到 cat',answer:'cat',options:[['dog','🐶'],['cat','🐱'],['bird','🐦']]},
  {id:'k-dog',title:'Happy Dog',icon:'🐶',word:'dog',phrase:'The happy dog can run.',prompt:'找到 dog',answer:'dog',options:[['fish','🐟'],['rabbit','🐰'],['dog','🐶']]},
  {id:'k-bird',title:'Flying Bird',icon:'🐦',word:'bird',phrase:'The bird can fly high.',prompt:'谁会 fly？',answer:'bird',options:[['bird','🐦'],['cat','🐱'],['fish','🐟']]},
  {id:'k-fish',title:'Blue Fish',icon:'🐟',word:'fish',phrase:'The fish can swim.',prompt:'谁会 swim？',answer:'fish',options:[['lion','🦁'],['fish','🐟'],['dog','🐶']]},
  {id:'k-lion',title:'Brave Lion',icon:'🦁',word:'lion',phrase:'The lion is big and brave.',prompt:'找到 lion',answer:'lion',options:[['lion','🦁'],['bird','🐦'],['rabbit','🐰']]}
 ]},
 {id:'family',name:'我的一天',desc:'从早安到晚安，把英语带进每天的生活',icon:'☀️',skin:'sky',lessons:[
  {id:'k-morning',title:'Good Morning',icon:'🌅',word:'morning',phrase:'Good morning, sunshine!',prompt:'太阳升起是什么时候？',answer:'morning',options:[['night','🌙'],['morning','🌅'],['rain','🌧️']]},
  {id:'k-milk',title:'Yummy Milk',icon:'🥛',word:'milk',phrase:'I like milk, please.',prompt:'找到 milk',answer:'milk',options:[['milk','🥛'],['bread','🍞'],['water','💧']]},
  {id:'k-school',title:'Go to School',icon:'🎒',word:'school',phrase:'I go to school with my bag.',prompt:'上学带什么？',answer:'school',options:[['home','🏠'],['park','🌳'],['school','🏫']]},
  {id:'k-play',title:'Let Us Play',icon:'🧸',word:'play',phrase:'Let us play together!',prompt:'一起玩说什么？',answer:'play',options:[['play','🧸'],['sleep','🛏️'],['eat','🍽️']]},
  {id:'k-night',title:'Good Night',icon:'🌙',word:'night',phrase:'Good night. Sweet dreams!',prompt:'睡觉前说什么？',answer:'night',options:[['morning','☀️'],['hello','👋'],['night','🌙']]}
 ]}
];
let child=null,progress=null,activeWorld=0,activeLesson=null,activityStep=0,lessonStarted=0,recognition=null;
const flatLessons=()=>WORLDS.flatMap(x=>x.lessons);
function modeProgress(){return progress.kindergarten;}
function renderHeader(){const p=modeProgress();document.getElementById('childAvatar').textContent=KidsAPI.avatar(child.avatar);document.getElementById('childName').textContent=child.nickname;document.getElementById('starCount').textContent='⭐ '+Number(p.stars||0);document.getElementById('stickerCount').textContent='🎟️ '+p.stickers.length;document.getElementById('progressText').textContent=p.completed.length+' / '+flatLessons().length;document.getElementById('progressBar').style.width=(p.completed.length/flatLessons().length*100)+'%';}
function renderWorldTabs(){document.getElementById('worldTabs').innerHTML=WORLDS.map((w,i)=>`<button class="world-tab ${i===activeWorld?'on':''}" onclick="selectWorld(${i})">${w.icon} ${w.name}</button>`).join('');}
function isUnlocked(id){const idx=flatLessons().findIndex(x=>x.id===id);return idx===0||modeProgress().completed.includes(flatLessons()[idx-1].id)||modeProgress().completed.includes(id);}
function renderWorld(){const w=WORLDS[activeWorld],p=modeProgress();const nodes=w.lessons.map((l,i)=>{const done=p.completed.includes(l.id),unlocked=isUnlocked(l.id);return`<button class="lesson-node ${done?'done':''}" ${unlocked?'': 'disabled'} onclick="startLesson('${l.id}')"><span class="lock">${done?'✓':unlocked?'':'🔒'}</span><span class="node-icon">${l.icon}</span><b>${i+1}. ${l.title}</b><small>${done?'已收集星星':'听 · 找 · 说'}</small><div class="node-stars">${done?'★★★':'☆☆☆'}</div></button>`;}).join('');document.getElementById('worldCard').className='world-card '+w.skin;document.getElementById('worldCard').innerHTML=`<div class="world-head"><div><h2>${w.icon} ${w.name}</h2><p>${w.desc}</p></div><div class="world-icon">${w.icon}</div></div><div class="lesson-path">${nodes}</div>`;renderWorldTabs();renderHeader();}
function selectWorld(i){activeWorld=i;renderWorld();}
function startLesson(id){activeLesson=flatLessons().find(x=>x.id===id);if(!activeLesson)return;activityStep=0;lessonStarted=Date.now();document.getElementById('activityName').textContent=activeLesson.title;document.getElementById('activityModal').classList.add('show');KidsAPI.event(child.id,'lesson_start',id);renderActivity();}
function closeActivity(){if(recognition)try{recognition.stop();}catch(e){}document.getElementById('activityModal').classList.remove('show');activeLesson=null;}
function sceneHTML(){return`<div class="activity-scene"><span class="scene-cloud">☁️</span><span class="scene-sun">☀️</span><span class="scene-friend">${activeLesson.icon}</span><span class="speech">${KidsAPI.escapeHTML(activeLesson.phrase)}</span></div>`;}
function renderActivity(){const body=document.getElementById('activityBody');if(activityStep===0){document.getElementById('activityStage').textContent='第 1 步 · 听一听';body.innerHTML=sceneHTML()+`<h2 class="activity-title">听角色说英语</h2><p class="activity-prompt">点播放，可以多听几次。</p><div class="activity-actions"><button class="btn btn-ghost" onclick="KidsAPI.speak(activeLesson.phrase,.78)">🔊 播放英语</button><button class="btn btn-coral" onclick="nextActivity()">我听到了 →</button></div>`;setTimeout(()=>KidsAPI.speak(activeLesson.phrase,.78),350);return;}if(activityStep===1){document.getElementById('activityStage').textContent='第 2 步 · 找一找';body.innerHTML=`<h2 class="activity-title">${activeLesson.prompt}</h2><p class="activity-prompt">听清楚，再点正确的图片。</p><div class="choice-grid">${activeLesson.options.map(x=>`<button class="choice" onclick="chooseAnswer(this,'${x[0]}')"><span class="choice-icon">${x[1]}</span>${x[0]}</button>`).join('')}</div><div class="feedback" id="choiceFeedback"></div>`;KidsAPI.speak(activeLesson.word,.72);return;}if(activityStep===2){document.getElementById('activityStage').textContent='第 3 步 · 开口说';body.innerHTML=`<div class="big-word">${activeLesson.word}</div><p class="activity-prompt">先听，再大声说出这个单词。勇敢开口就是成功！</p><div class="activity-actions"><button class="btn btn-ghost" onclick="KidsAPI.speak(activeLesson.word,.68)">🔊 听发音</button><button class="btn btn-mint" onclick="startRepeat()">🎙️ 我来说</button><button class="btn btn-coral" onclick="completeLesson()">说好了，收星星 →</button></div><div class="feedback" id="repeatFeedback"></div>`;return;}document.getElementById('activityStage').textContent='完成 · 获得奖励';body.innerHTML=`<div class="reward-burst">🌟</div><h2 class="activity-title">太棒了，${KidsAPI.escapeHTML(child.nickname)}！</h2><p class="activity-prompt">你学会了 <b>${activeLesson.word}</b>，获得 3 颗星和一张新贴纸。</p><div class="activity-actions"><button class="btn btn-coral" onclick="finishAndClose()">继续探索动画岛</button></div>`;}
function nextActivity(){activityStep++;renderActivity();}
function chooseAnswer(btn,value){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const ok=value===activeLesson.answer;btn.classList.add(ok?'correct':'wrong');const f=document.getElementById('choiceFeedback');if(ok){f.textContent='答对啦！Great job!';f.className='feedback ok';KidsAPI.speak('Great job!',.85);setTimeout(()=>{activityStep=2;renderActivity();},850);}else{f.textContent='再看一看，正确答案会发光。';f.className='feedback no';document.querySelectorAll('.choice').forEach(x=>{if(x.textContent.trim().endsWith(activeLesson.answer))x.classList.add('correct');});setTimeout(()=>{activityStep=2;renderActivity();},1300);}}
function startRepeat(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,f=document.getElementById('repeatFeedback');KidsAPI.speak(activeLesson.word,.68);if(!SR){f.textContent='已经听到了你的勇敢声音！';f.className='feedback ok';return;}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.onstart=()=>{f.textContent='正在听…请说 '+activeLesson.word;f.className='feedback';};recognition.onresult=e=>{const heard=e.results[0][0].transcript.toLowerCase();const ok=heard.includes(activeLesson.word);f.textContent=ok?'说得真清楚！':'听到 “'+heard+'”，再试一次也可以。';f.className='feedback '+(ok?'ok':'no');};recognition.onerror=()=>{f.textContent='麦克风暂不可用，跟着声音说一遍也算完成。';};recognition.start();}
async function completeLesson(){const p=modeProgress(),already=p.completed.includes(activeLesson.id);if(!already){p.completed.push(activeLesson.id);p.stars=Number(p.stars||0)+3;if(!p.stickers.includes(activeLesson.icon))p.stickers.push(activeLesson.icon);progress.activityDays[KidsAPI.today()]=Number(progress.activityDays[KidsAPI.today()]||0)+1;await KidsAPI.saveProgress(child.id,progress);await KidsAPI.event(child.id,'lesson_complete',activeLesson.id,{score:100,duration:Math.round((Date.now()-lessonStarted)/1000),metadata:{word:activeLesson.word}});}activityStep=3;renderActivity();renderHeader();}
function finishAndClose(){const idx=flatLessons().findIndex(x=>x.id===activeLesson.id);closeActivity();if(idx>=0&&idx<flatLessons().length-1){const next=flatLessons()[idx+1];activeWorld=WORLDS.findIndex(w=>w.lessons.some(x=>x.id===next.id));}renderWorld();KidsAPI.toast('新关卡已解锁！');}
async function boot(){try{child=await KidsAPI.selectedChild('kindergarten');if(!child)return;progress=KidsAPI.normalizeProgress(await KidsAPI.loadProgress(child.id));renderWorld();}catch(e){KidsAPI.toast(e.message);setTimeout(()=>location.href='/kids',1000);}finally{KidsAPI.showLoading(false);}}
document.getElementById('activityModal').addEventListener('click',e=>{if(e.target.id==='activityModal')closeActivity();});
boot();
</script>
</body>
</html>
