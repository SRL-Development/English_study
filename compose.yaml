name: english-study

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-english-study:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /data
      APP_DB_PATH: /data/app.db
      TTS_CACHE_DIR: /data/tts_cache
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - english_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  english_data:
    name: english-study-data
