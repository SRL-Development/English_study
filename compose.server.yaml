name: english-study

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  env_file:
    - .env
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  user:
    <<: *service-defaults
    image: ${USER_IMAGE:-ghcr.io/srl-development/english-study-user:latest}
    pull_policy: always
    environment:
      APP_ROLE: user
      APP_PORT: 5000
      APP_DATA_DIR: /data
      APP_DB_PATH: /data/app.db
      TTS_CACHE_DIR: /data/tts_cache
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - english_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  admin:
    <<: *service-defaults
    image: ${ADMIN_IMAGE:-ghcr.io/srl-development/english-study-admin:latest}
    pull_policy: always
    environment:
      APP_ROLE: admin
      APP_PORT: 5001
      APP_DATA_DIR: /data
      APP_DB_PATH: /data/app.db
      TTS_CACHE_DIR: /data/tts_cache
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - english_data:/data
    depends_on:
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  english_data:
    name: english-study-data
