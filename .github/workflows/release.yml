name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_server.py
      - name: Check deployment scripts
        run: |
          bash -n deploy/1panel/update.sh
          bash -n deploy/cloud/install-dependencies.sh
          bash -n deploy/docker/install.sh
          bash -n deploy/docker/update.sh
          bash -n deploy/nginx/configure.sh
      - name: Validate production Compose
        run: |
          cp .env.example .env
          docker compose -f compose.server.yaml config --quiet
      - name: Validate Nginx templates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl
          sudo mkdir -p /etc/letsencrypt/live/learn.example.com
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=learn.example.com' \
            -keyout /etc/letsencrypt/live/learn.example.com/privkey.pem \
            -out /etc/letsencrypt/live/learn.example.com/fullchain.pem
          sed -e 's/__SITE_DOMAIN__/learn.example.com/g' \
              -e 's/__ADMIN_DOMAIN__/admin.example.com/g' \
              deploy/nginx/english-study-http.conf.template \
            | sudo tee /etc/nginx/conf.d/english-study.conf >/dev/null
          sudo nginx -t
          sed -e 's/__SITE_DOMAIN__/learn.example.com/g' \
              -e 's/__ADMIN_DOMAIN__/admin.example.com/g' \
              deploy/nginx/english-study-https.conf.template \
            | sudo tee /etc/nginx/conf.d/english-study.conf >/dev/null
          sudo nginx -t

  docker:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - role: user
            port: 5000
            image: ghcr.io/srl-development/english-study-user
          - role: admin
            port: 5001
            image: ghcr.io/srl-development/english-study-admin
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_ROLE=${{ matrix.role }}
            APP_PORT=${{ matrix.port }}
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_BUILD=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}
      - name: Smoke test published image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "${{ matrix.image }}:latest"
          docker run -d --name english-study-smoke \
            -e ADMIN_PASSWORD=smoke-test-only \
            -p "127.0.0.1:${{ matrix.port }}:${{ matrix.port }}" \
            "${{ matrix.image }}:latest"
          cleanup() {
            docker logs english-study-smoke || true
            docker rm -f english-study-smoke || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl -fsS "http://127.0.0.1:${{ matrix.port }}/api/health" \
              | grep -q '"role":"${{ matrix.role }}"'; then
              if [[ "${{ matrix.role }}" == "user" ]]; then
                curl -fsS "http://127.0.0.1:${{ matrix.port }}/kids" \
                  | grep -q 'EnglishLab Family'
                curl -fsS "http://127.0.0.1:${{ matrix.port }}/kids/kindergarten" \
                  | grep -q '动画英语岛'
                curl -fsS "http://127.0.0.1:${{ matrix.port }}/kids/primary" \
                  | grep -q '英语挑战世界'
                curl -fsS "http://127.0.0.1:${{ matrix.port }}/assets/kids-common.js" \
                  | grep -q 'KidsAPI'
              else
                curl -fsS "http://127.0.0.1:${{ matrix.port }}/admin/login" \
                  | grep -q '运营控制台'
              fi
              exit 0
            fi
            sleep 2
          done
          exit 1
