name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_server.py

  docker:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - role: user
            port: 5000
            image: ghcr.io/shirenliang12-source/english-study-user
          - role: admin
            port: 5001
            image: ghcr.io/shirenliang12-source/english-study-admin
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ROLE=${{ matrix.role }}
            APP_PORT=${{ matrix.port }}
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}
      - name: Smoke test published image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "${{ matrix.image }}:latest"
          docker run -d --name english-study-smoke \
            -e ADMIN_PASSWORD=smoke-test-only \
            -p "127.0.0.1:${{ matrix.port }}:${{ matrix.port }}" \
            "${{ matrix.image }}:latest"
          cleanup() {
            docker logs english-study-smoke || true
            docker rm -f english-study-smoke || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl -fsS "http://127.0.0.1:${{ matrix.port }}/api/health" \
              | grep -q '"role":"${{ matrix.role }}"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
